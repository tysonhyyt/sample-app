
name: Deploy Node.js to Compute Engine

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: operise
  PROJECT_NUMBER: "1067143910197"
  ZONE: asia-southeast1-b
  SERVICE_NAME: sample-app
  ARTIFACTORY_PATH: asia-southeast1-docker.pkg.dev/operise/npartifacts
  ARTIFACTORY_NAME: npartifacts
  WIF_PROVIDER: projects/1067143910197/locations/global/workloadIdentityPools/non-production/providers/github-action-provider
  DEPLOY_SA: svc-npdeploy@operise.iam.gserviceaccount.com
  RUNTIME_SA: svc-npdeploy@operise.iam.gserviceaccount.com
  REGION: asia-southeast1

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare artifact
        run: |
          mkdir -p target
          cp -r node_modules target
          cp package.json package-lock.json target
          cp -r .next target
          cp next.config.ts target
          cp -r public target

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: target

  dockerize-and-publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
          path: target

      # 4. Configure Docker to authenticate to Artifact Registry
      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      # 5. Build and push the container image
      - name: Build and push Docker image
        env:
          IMAGE: ${{ env.ARTIFACTORY_PATH }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          echo -e "$IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: dockerize-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        
      # 6. Deploy the image to Cloud Run
      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.ARTIFACTORY_PATH }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="$RUNTIME_SA" \
            --startup-probe=httpGet.path="/api/health" \
            --liveness-probe=httpGet.path="/api/health" \
            --quiet

      # 7. Verify the deployed service
      - name: Verify deployment
        run: |
          gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format="yaml(status.conditions,status.latestReadyRevisionName,status.url)"
